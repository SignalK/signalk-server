app = "latest-signalk-org"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]
  # Fly's proxy connects to the server and appends the app's own IP address
  # to X-Forwarded-For, so the visitor's address is two hops back
  # (https://fly.io/docs/networking/request-headers/)
  TRUST_PROXY = "2"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 3000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 100
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
