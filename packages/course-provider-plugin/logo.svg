<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Course Provider">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6ea8"/>
      <stop offset="1" stop-color="#0b3a5e"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="128" height="128" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="128" height="128" fill="url(#sea)"/>

    <g stroke="#bee3f4" stroke-opacity="0.25" stroke-width="1" fill="none">
      <path d="M0 24 H128 M0 48 H128 M0 72 H128 M0 96 H128"/>
      <path d="M24 0 V128 M48 0 V128 M72 0 V128 M96 0 V128"/>
    </g>

    <!-- plotted course from the vessel to the destination waypoint -->
    <path d="M38 92 L88 40" fill="none" stroke="#e63946" stroke-width="3.4" stroke-linecap="round"/>

    <!-- intermediate waypoint on the course -->
    <circle cx="63" cy="66" r="3.4" fill="#e2e8f0" stroke="#0b3a5e" stroke-width="1.4"/>

    <!-- destination waypoint with arrival circle -->
    <circle cx="88" cy="40" r="14" fill="none" stroke="#bee3f4" stroke-width="1.8" stroke-dasharray="4.5 3.5"/>
    <circle cx="88" cy="40" r="4.2" fill="#e63946" stroke="#0b3a5e" stroke-width="1.3"/>

    <!-- vessel at the start of the course, heading along the bearing -->
    <g transform="translate(38 92) rotate(45)">
      <polygon points="0,-13 8,9 -8,9" fill="#e2e8f0" stroke="#0b3a5e" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="0" cy="-1" r="2.4" fill="#0b3a5e"/>
    </g>

    <!-- compass rose -->
    <g transform="translate(104 104)">
      <circle r="11" fill="#0b3a5e" fill-opacity="0.7" stroke="#bee3f4" stroke-width="0.8"/>
      <polygon points="0,-9 2.2,0 0,0" fill="#e63946"/>
      <polygon points="0,-9 -2.2,0 0,0" fill="#b5232f"/>
      <polygon points="0,9 2.2,0 0,0" fill="#e2e8f0"/>
      <polygon points="0,9 -2.2,0 0,0" fill="#cbd5e1"/>
      <circle r="1.1" fill="#e2e8f0"/>
    </g>
  </g>
</svg>
